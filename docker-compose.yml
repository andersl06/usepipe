services:
  postgres:
    # pgvector em vez de postgres:16 puro: `trecho_conhecimento.embedding` e vector(1536).
    image: pgvector/pgvector:pg16
    container_name: pipe-postgres
    environment:
      POSTGRES_USER: pipe
      POSTGRES_PASSWORD: pipe
      POSTGRES_DB: pipe
      TZ: America/Sao_Paulo
    ports:
      # 5433 e 6380 no host para não brigar com um Postgres ou Redis já instalado.
      - '5433:5432'
    volumes:
      - pipe-postgres:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/10-init.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U pipe -d pipe']
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: pipe-redis
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '6380:6379'
    volumes:
      - pipe-redis:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  pipe-postgres:
  pipe-redis:
