# Alertas. Dois grupos, e a diferença entre eles é uma decisão, não um rótulo:
#
#   severidade=acorda  → toca o telefone às 3h. Cliente já está sentindo.
#   severidade=ticket  → vira tarefa no dia seguinte. Ninguém acorda.
#
# Alerta que toca e não exige ação é o mecanismo pelo qual todo alerta passa a ser
# ignorado. Se algo aqui tocar duas vezes sem ação, ele desce para `ticket`.

groups:
  - name: pipe-acorda
    rules:
      - alert: ApiForaDoAr
        expr: up{job="pipe-api"} == 0
        for: 2m
        labels: { severidade: acorda }
        annotations:
          resumo: 'A API não responde há 2 minutos'
          acao: 'docker compose ps; docker compose logs --tail=200 api'

      - alert: EntregaFalhando
        # Taxa de falha por canal: é o número que avisa antes do cliente ligar
        # (§8 da spec). 20% em 10 minutos é falha de credencial ou de número
        # bloqueado, não azar.
        expr: |
          sum by (canal) (rate(pipe_mensagem_entrega_total{resultado="falha"}[10m]))
            /
          sum by (canal) (rate(pipe_mensagem_entrega_total[10m])) > 0.2
        for: 10m
        labels: { severidade: acorda }
        annotations:
          resumo: 'Mais de 20% das mensagens do canal {{ $labels.canal }} estão falhando'

      - alert: FilaParada
        # Profundidade sozinha engana: fila grande escoando é hora cheia normal.
        # O que dói é o item mais velho não sair.
        expr: pipe_fila_idade_item_mais_velho_segundos > 900
        for: 5m
        labels: { severidade: acorda }
        annotations:
          resumo: 'Item de {{ $labels.fila }} parado há mais de 15 minutos'

      # `WorkerParado` saiu daqui. Ele media `up{job="pipe-workers"}`, e não existe
      # alvo `pipe-workers`: `apps/workers` não expõe HTTP. A regra ficaria em
      # disparo permanente, tocando o telefone toda madrugada sem nada a fazer —
      # que é o mecanismo exato pelo qual todo o resto deste arquivo passa a ser
      # ignorado. O sintoma real de worker parado já aparece em `FilaParada`, com
      # métrica que EXISTE. Volta quando `apps/workers` publicar /metrics.

      - alert: BancoForaDoAr
        expr: pg_up == 0
        for: 2m
        labels: { severidade: acorda }

      - alert: DiscoQuaseCheio
        expr: |
          node_filesystem_avail_bytes{mountpoint="/host"}
            / node_filesystem_size_bytes{mountpoint="/host"} < 0.10
        for: 5m
        labels: { severidade: acorda }
        annotations:
          resumo: 'Menos de 10% de disco livre — o Postgres para quando acabar'

      - alert: RestauracaoNaoValida
        # O alerta mais importante do arquivo, e o menos óbvio: ele dispara quando
        # o backup existe mas NÃO restaura. Descobrir isso num domingo de manhã é
        # barato; descobrir no dia do desastre não é.
        expr: pipe_restauracao_ok == 0
        for: 10m
        labels: { severidade: acorda }

  - name: pipe-ticket
    rules:
      - alert: BackupAtrasado
        expr: time() - pipe_backup_fim_timestamp > 129600 # 36h
        labels: { severidade: ticket }
        annotations:
          resumo: 'O último backup terminou há mais de 36 horas'

      - alert: TesteDeRestauracaoAtrasado
        expr: time() - pipe_restauracao_fim_timestamp > 691200 # 8 dias
        labels: { severidade: ticket }

      - alert: CertificadoVencendo
        expr: (traefik_tls_certs_not_after - time()) / 86400 < 10
        labels: { severidade: ticket }
        annotations:
          resumo: 'Certificado de {{ $labels.cn }} vence em menos de 10 dias'

      - alert: DiscoEnchendo
        expr: |
          predict_linear(node_filesystem_avail_bytes{mountpoint="/host"}[6h], 7*24*3600) < 0
        for: 1h
        labels: { severidade: ticket }
        annotations:
          resumo: 'No ritmo atual, o disco acaba em uma semana'

      - alert: MigrationPendente
        expr: pipe_migration_pendente > 0
        for: 15m
        labels: { severidade: ticket }

      - alert: LatenciaDaApiAlta
        expr: histogram_quantile(0.95, sum by (le) (rate(http_request_duration_seconds_bucket[10m]))) > 1.5
        for: 20m
        labels: { severidade: ticket }
