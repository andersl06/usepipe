
# Configuração compartilhada pelo contêiner do Postgres (que faz archive-push) e
# pelo contêiner de backup (que faz backup, restore e verify).
#
# As credenciais do bucket NÃO estão aqui: chegam por ambiente
# (PGBACKREST_REPO1_S3_KEY / _SECRET), a partir do arquivo SOPS.

[global]
repo1-type=s3
repo1-path=/pipe
repo1-s3-bucket=pipe-backup
repo1-s3-endpoint=s3.us-west-004.backblazeb2.com
repo1-s3-region=us-west-004
repo1-s3-uri-style=path

# Cifrado no repositório: quem tomar o bucket leva arquivo inútil. A senha vive no
# SOPS junto do resto — e perdê-la é perder o backup, então ela tem cópia offline.
repo1-cipher-type=aes-256-cbc

# 30 dias de full/diff, conforme §7 da spec. O expire roda junto do backup diário.
repo1-retention-full=4
repo1-retention-full-type=count
repo1-retention-diff=14

# Assíncrono com 2 processos: sem isto, o archive_command vira o gargalo de
# escrita do banco na hora cheia e o Postgres passa a esperar o upload.
archive-async=y
archive-push-queue-max=2GiB
spool-path=/var/spool/pgbackrest
process-max=2

start-fast=y
compress-type=zst
log-level-console=info
log-level-file=detail

[pipe]
pg1-path=/var/lib/postgresql/data
# Soquete unix, não TCP: o contêiner de backup monta o mesmo volume de soquete e
# fala com o banco sem que exista uma porta a mais aberta em lugar nenhum.
pg1-socket-path=/var/run/postgresql
pg1-port=5432
pg1-user=pipe
