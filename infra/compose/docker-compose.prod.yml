# Pipe em produção numa máquina só — o degrau pequeno.
#
# Diferenças em relação ao docker-compose.yml da raiz, que é de desenvolvimento:
# nenhuma porta de banco publicada, imagem versionada em vez de build local, teto
# de CPU e memória por serviço, healthcheck em tudo que recebe tráfego, e o
# backup como serviço de verdade.
#
# Uso:  docker compose -f docker-compose.prod.yml --env-file /opt/pipe-dados/.env up -d
# O .env é gerado pelo deploy.sh a partir do arquivo SOPS; nunca é versionado.

name: pipe

x-padrao: &padrao
  restart: unless-stopped
  # Log sem rotação enche o disco da VPS em semanas e derruba o Postgres junto.
  logging:
    driver: json-file
    options:
      max-size: '20m'
      max-file: '5'

x-app: &app
  <<: *padrao
  env_file: [/opt/pipe-dados/.env]
  networks: [borda, dados]
  # Tetos calculados para uma VPS de 4 vCPU / 16 GB. A soma dos limites passa do
  # total de propósito: nem todos chegam no teto ao mesmo tempo. O que não pode
  # faltar é o teto — sem ele, um vazamento no worker mata o Postgres junto.
  # deploy.resources vale no `docker compose up`, sem Swarm nenhum.
  # https://docs.docker.com/reference/compose-file/deploy/
  deploy:
    resources:
      limits:
        cpus: '1.0'
        memory: 1g
      reservations:
        memory: 256m

services:
  traefik:
    <<: *padrao
    image: traefik:v3.3
    command:
      - --providers.docker=true
      # Sem isto, todo contêiner novo vira rota publicada por acidente.
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
      - --entrypoints.web.http.redirections.entrypoint.to=websec
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --entrypoints.websec.address=:443
      # ACME por desafio HTTP: não exige token de DNS na máquina, e a porta 80 já
      # precisa estar aberta para o redirecionamento.
      # https://doc.traefik.io/traefik/reference/install-configuration/tls/certificate-resolvers/acme/
      - --certificatesresolvers.le.acme.email=${ACME_EMAIL}
      - --certificatesresolvers.le.acme.storage=/acme/acme.json
      - --certificatesresolvers.le.acme.httpchallenge.entrypoint=web
      - --accesslog=true
      - --metrics.prometheus=true
      - --ping=true
    ports:
      - '80:80'
      - '443:443'
    volumes:
      # Somente leitura: o Traefik precisa descobrir contêiner, não controlar o
      # Docker. Socket rw aqui é root na máquina para quem tomar o Traefik.
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /opt/pipe-dados/acme:/acme
    networks: [borda]
    healthcheck:
      test: ['CMD', 'traefik', 'healthcheck', '--ping']
      interval: 20s
      timeout: 5s
      retries: 3

  api:
    <<: *app
    # Construída por infra/construir-imagens.sh a partir de apps/api/Dockerfile.
    image: ghcr.io/pipe/api:${PIPE_VERSAO}
    # Sem `healthcheck:` aqui de propósito: quem manda é o HEALTHCHECK da imagem,
    # para não haver duas verdades. O que estava escrito neste lugar chamava
    # /saude, que apps/api ainda não expõe (pendência 1 do infra/README) — o
    # contêiner nascia unhealthy e o `up -d --wait` do deploy.sh nunca fechava.
    labels:
      - traefik.enable=true
      - traefik.http.routers.api.rule=Host(`api.pipe.com.br`)
      - traefik.http.routers.api.entrypoints=websec
      - traefik.http.routers.api.tls.certresolver=le
      - traefik.http.services.api.loadbalancer.server.port=3100
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  workers:
    <<: *app
    image: ghcr.io/pipe/workers:${PIPE_VERSAO}
    # Fila de entrega é o que segura a conta na hora cheia; é o primeiro serviço a
    # ganhar réplica quando a profundidade da fila subir (§7 da spec).
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: '1.0'
          memory: 1g
    labels:
      - traefik.enable=false
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  desk:
    <<: *app
    # Construída por infra/construir-imagens.sh a partir de apps/desk/Dockerfile.
    # A imagem escuta na 3000 (a 3200 é só do `pnpm dev`).
    image: ghcr.io/pipe/desk:${PIPE_VERSAO}
    # Healthcheck vem da imagem. O que estava aqui chamava /api/saude, rota que o
    # Desk não tem — nascia unhealthy e travava a publicação.
    labels:
      - traefik.enable=true
      - traefik.http.routers.desk.rule=Host(`app.pipe.com.br`)
      - traefik.http.routers.desk.entrypoints=websec
      - traefik.http.routers.desk.tls.certresolver=le
      - traefik.http.services.desk.loadbalancer.server.port=3000

  gestao:
    <<: *app
    image: ghcr.io/pipe/gestao:${PIPE_VERSAO}
    labels:
      - traefik.enable=true
      - traefik.http.routers.gestao.rule=Host(`gestao.pipe.com.br`)
      - traefik.http.routers.gestao.entrypoints=websec
      - traefik.http.routers.gestao.tls.certresolver=le
      - traefik.http.services.gestao.loadbalancer.server.port=3000

  # O CRM que existe HOJE é `apps/crm`, Next 15, código nosso, dentro do monorepo —
  # e é ele que esta imagem empacota (infra/construir-imagens.sh, apps/crm/Dockerfile).
  #
  # O fork AGPLv3 do Twenty (docs/specs/2026-09-07-fork-do-twenty.md) ainda não tem
  # imagem publicada. Quando tiver, esta linha vira
  # `image: ghcr.io/pipe/crm-fork:${PIPE_CRM_VERSAO}` e nada mais muda: a fronteira
  # de licença é justamente esta — serviço separado, imagem separada, conversa por
  # rede, e nenhum `build: ../..` apontando para o monorepo.
  crm:
    <<: *padrao
    image: ghcr.io/pipe/crm:${PIPE_VERSAO}
    env_file: [/opt/pipe-dados/.env.crm]
    networks: [borda, dados]
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 2g
    labels:
      - traefik.enable=true
      - traefik.http.routers.crm.rule=Host(`crm.pipe.com.br`)
      - traefik.http.routers.crm.entrypoints=websec
      - traefik.http.routers.crm.tls.certresolver=le
      - traefik.http.services.crm.loadbalancer.server.port=3000

  site:
    <<: *padrao
    image: ghcr.io/pipe/site:${PIPE_VERSAO}
    networks: [borda]
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 128m
    labels:
      - traefik.enable=true
      - traefik.http.routers.site.rule=Host(`pipe.com.br`) || Host(`www.pipe.com.br`)
      - traefik.http.routers.site.entrypoints=websec
      - traefik.http.routers.site.tls.certresolver=le
      - traefik.http.services.site.loadbalancer.server.port=80

  postgres:
    <<: *padrao
    # Imagem própria só para ter o pgbackrest ao lado do Postgres: o
    # archive_command roda DENTRO deste contêiner, então o binário precisa estar
    # aqui — não adianta deixá-lo só no contêiner de backup.
    build:
      context: ./postgres
    environment:
      POSTGRES_USER: pipe
      POSTGRES_PASSWORD: ${POSTGRES_SENHA}
      POSTGRES_DB: pipe
      TZ: America/Sao_Paulo
    command:
      - postgres
      - -c
      - archive_mode=on
      - -c
      - archive_command=pgbackrest --stanza=pipe archive-push %p
      # WAL fechado a cada 60s: é isto que torna verdadeira a promessa de RPO de 5
      # minutos num banco parado de madrugada, quando o WAL demoraria horas a encher.
      - -c
      - archive_timeout=60
      - -c
      - max_wal_size=2GB
      - -c
      - shared_buffers=2GB
    volumes:
      - pgdados:/var/lib/postgresql/data
      - ./postgres/pgbackrest.conf:/etc/pgbackrest/pgbackrest.conf:ro
      # O soquete unix é compartilhado com o contêiner de backup: é assim que o
      # pgBackRest abre e fecha o backup sem que o Postgres precise escutar em TCP
      # para alguém além da rede `dados`.
      - pgsock:/var/run/postgresql
    # Nenhuma porta publicada. Para depurar: `docker compose exec postgres psql`
    # ou um túnel SSH — não um mapeamento que fica aberto para sempre.
    networks: [dados]
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 6g
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U pipe -d pipe']
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    <<: *padrao
    image: redis:7-alpine
    command:
      [
        'redis-server',
        '--appendonly',
        'yes',
        '--maxmemory',
        '512mb',
        '--maxmemory-policy',
        'noeviction',
      ]
    # noeviction de propósito: BullMQ perdendo job por despejo silencioso vira
    # mensagem que o cliente jura ter enviado e que nunca saiu.
    volumes:
      - redisdados:/data
    networks: [dados]
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 768m
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 10

  backup:
    <<: *padrao
    # Mesma imagem do banco de propósito: o teste de restauração precisa da MESMA
    # versão de Postgres e das MESMAS extensões, senão ele valida outra coisa.
    build:
      context: ./postgres
    restart: 'no' # disparado por systemd timer, não fica em laço
    user: postgres
    entrypoint: ['/bin/bash']
    environment:
      PGBACKREST_REPO1_S3_KEY: ${BACKUP_S3_KEY}
      PGBACKREST_REPO1_S3_KEY_SECRET: ${BACKUP_S3_SEGREDO}
      HEALTHCHECK_URL_BACKUP: ${HEALTHCHECK_URL_BACKUP}
      HEALTHCHECK_URL_RESTAURACAO: ${HEALTHCHECK_URL_RESTAURACAO}
      PGPASSWORD: ${POSTGRES_SENHA}
    volumes:
      # PGDATA porque o pgBackRest lê os arquivos direto; a conexão libpq é só
      # para abrir e fechar o backup.
      - pgdados:/var/lib/postgresql/data
      - ./postgres/pgbackrest.conf:/etc/pgbackrest/pgbackrest.conf:ro
      - ./backup:/scripts:ro
      - pgsock:/var/run/postgresql
      - metricas:/metricas
    # `borda` também porque o repositório fica em storage de objetos, fora desta
    # máquina. Backup no mesmo disco do banco não é backup.
    networks: [dados, borda]

  prometheus:
    <<: *padrao
    image: prom/prometheus:v3.1.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      # 15 dias resolve "o que houve na semana passada". Série histórica de
      # negócio já vive em metrica_diaria, no Postgres.
      - --storage.tsdb.retention.time=15d
    volumes:
      - ../observabilidade/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../observabilidade/alertas.yml:/etc/prometheus/alertas.yml:ro
      - promdados:/prometheus
      - metricas:/metricas:ro
    networks: [borda, dados]
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 1g

  alertmanager:
    <<: *padrao
    image: prom/alertmanager:v0.28.0
    volumes:
      - ../observabilidade/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    networks: [borda]
    deploy:
      resources:
        limits:
          cpus: '0.2'
          memory: 128m

  node-exporter:
    <<: *padrao
    image: prom/node-exporter:v1.8.2
    command:
      - --path.rootfs=/host
      # É por aqui que "o backup falhou" e "a restauração não valida" viram série
      # temporal e, no passo seguinte, alerta.
      - --collector.textfile.directory=/metricas
    pid: host
    volumes:
      - /:/host:ro,rslave
      - metricas:/metricas:ro
    networks: [dados]
    deploy:
      resources:
        limits:
          memory: 128m

  postgres-exporter:
    <<: *padrao
    image: quay.io/prometheuscommunity/postgres-exporter:v0.16.0
    environment:
      DATA_SOURCE_NAME: postgresql://pipe:${POSTGRES_SENHA}@postgres:5432/pipe?sslmode=disable
    networks: [dados]
    deploy:
      resources:
        limits:
          memory: 128m

  grafana:
    <<: *padrao
    image: grafana/grafana:11.5.0
    # Perfil opcional: alerta é obrigatório, painel é conforto. Suba quando
    # alguém for de fato olhar — `docker compose --profile painel up -d`.
    profiles: [painel]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_SENHA}
      GF_USERS_ALLOW_SIGN_UP: 'false'
    volumes:
      - grafanadados:/var/lib/grafana
    networks: [borda]
    labels:
      - traefik.enable=true
      - traefik.http.routers.grafana.rule=Host(`metricas.pipe.com.br`)
      - traefik.http.routers.grafana.entrypoints=websec
      - traefik.http.routers.grafana.tls.certresolver=le
      - traefik.http.services.grafana.loadbalancer.server.port=3000

  # Migration roda ANTES do código novo subir (§9 da spec) e sai.
  # `docker compose --profile tarefa run --rm migrar`
  migrar:
    <<: *padrao
    image: ghcr.io/pipe/api:${PIPE_VERSAO}
    profiles: [tarefa]
    restart: 'no'
    env_file: [/opt/pipe-dados/.env]
    # `pnpm --filter @pipe/db migrar` NÃO roda aqui: a imagem de produção não tem
    # pnpm, tsx nem devDependencies. O `dist/migrar.js` compilado faz o mesmo —
    # aplica as migrations e garante as partições — e os .sql viajam junto em
    # packages/db/drizzle.
    command: ['node', '/app/packages/db/dist/migrar.js']
    networks: [dados]

networks:
  # Onde o Traefik alcança a aplicação e a aplicação alcança a internet
  # (Meta, provedor de IA, storage de objetos).
  borda:
  # Postgres e Redis vivem aqui e em nenhum outro lugar. `internal: true` corta a
  # saída para a internet: um Postgres comprometido não exfiltra nada sozinho, e
  # nenhum serviço novo ganha acesso ao banco por descuido de rede.
  dados:
    internal: true

volumes:
  pgdados:
  pgsock:
  redisdados:
  promdados:
  grafanadados:
  # Onde os scripts de backup escrevem a métrica lida pelo Prometheus
  # (textfile collector): é assim que "a restauração falhou" vira alerta.
  metricas:
