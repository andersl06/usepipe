# Rotas e certificado.
#
# Ingress "clássico" e não Gateway API: a API de Ingress continua disponível e
# congelada, o Gateway API é para onde o projeto aponta, e migrar é troca de
# manifesto — não de arquitetura. Quando o Traefik e o provedor estiverem estáveis
# em Gateway API, este arquivo vira um HTTPRoute e nada mais muda.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: pipe-tls
spec:
  secretName: pipe-tls
  issuerRef:
    name: letsencrypt
    kind: ClusterIssuer
  dnsNames:
    - app.usepipe.com.br
    - gestao.usepipe.com.br
    - api.usepipe.com.br
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: pipe
  annotations:
    # O webhook da Meta manda mídia; o padrão de 1MB do ingress recusa e a
    # mensagem se perde com um 413 que ninguém lê.
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
spec:
  ingressClassName: traefik
  tls:
    - hosts: [app.usepipe.com.br, gestao.usepipe.com.br, api.usepipe.com.br]
      secretName: pipe-tls
  rules:
    - host: app.usepipe.com.br
      http:
        paths:
          - { path: /, pathType: Prefix, backend: { service: { name: desk, port: { number: 80 } } } }
    - host: gestao.usepipe.com.br
      http:
        paths:
          - { path: /, pathType: Prefix, backend: { service: { name: gestao, port: { number: 80 } } } }
    - host: api.usepipe.com.br
      http:
        paths:
          - { path: /, pathType: Prefix, backend: { service: { name: api, port: { number: 80 } } } }
