# API: o serviço que recebe webhook da Meta e o tráfego do Desk.
#
# É o único que não pode ficar indisponível durante uma publicação: webhook
# perdido é mensagem de cliente perdida, e a Meta reenvia por pouco tempo.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  labels: { app: api }
spec:
  replicas: 2
  selector:
    matchLabels: { app: api }
  template:
    metadata:
      labels: { app: api }
    spec:
      # Espalha as réplicas por nó: duas réplicas no mesmo nó caem juntas e o
      # PodDisruptionBudget não salva ninguém.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: { app: api }
      containers:
        - name: api
          image: ghcr.io/pipe/api:latest # a tag real vem do overlay
          ports:
            - { name: http, containerPort: 3100 }
            - { name: metricas, containerPort: 9464 }
          envFrom:
            - secretRef: { name: pipe-segredos }
            - configMapRef: { name: pipe-config }
          # requests é o que o escalonador usa para caber no nó; limits é o teto
          # que impede um vazamento de derrubar o vizinho. Sem requests, o pod é
          # BestEffort e é o primeiro a morrer sob pressão de memória.
          resources:
            requests: { cpu: 200m, memory: 512Mi }
            limits: { cpu: '1', memory: 1Gi }
          # Três sondas com papéis diferentes: startup dá tempo ao Next/Nest sem
          # afrouxar a liveness; readiness tira do balanceamento sem reiniciar;
          # liveness reinicia. Usar a mesma para as três é como não ter nenhuma.
          startupProbe:
            httpGet: { path: /saude, port: http }
            failureThreshold: 30
            periodSeconds: 2
          readinessProbe:
            httpGet: { path: /saude, port: http }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /saude/vivo, port: http }
            periodSeconds: 15
            failureThreshold: 4
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities: { drop: ['ALL'] }
      # Tempo para terminar o que está em voo. O padrão de 30s corta requisição de
      # webhook no meio quando o nó está carregado.
      terminationGracePeriodSeconds: 60
---
apiVersion: v1
kind: Service
metadata:
  name: api
spec:
  selector: { app: api }
  ports:
    - { name: http, port: 80, targetPort: http }
    - { name: metricas, port: 9464, targetPort: metricas }
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: api
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: api }
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 70 }
  behavior:
    # Subir rápido, descer devagar: atendimento tem pico curto, e encolher no meio
    # do pico é como criar um segundo pico.
    scaleDown:
      stabilizationWindowSeconds: 600
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: api
spec:
  # 1, não 2. Com duas réplicas, minAvailable=2 proíbe QUALQUER despejo e trava a
  # drenagem de nó para sempre — o PDB que protege demais vira o incidente.
  # Quando o mínimo do HPA subir para 3, este número sobe para 2.
  minAvailable: 1
  selector:
    matchLabels: { app: api }
