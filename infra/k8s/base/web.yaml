# Desk e Gestão. Dois Next.js iguais em forma, diferentes em imagem e hostname.
#
# Ficam num arquivo só porque a diferença entre eles cabe em três linhas; separar
# em dois arquivos idênticos é o começo do dia em que um recebe uma correção e o
# outro não.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: desk
  labels: { app: desk }
spec:
  replicas: 2
  selector:
    matchLabels: { app: desk }
  template:
    metadata:
      labels: { app: desk }
    spec:
      containers:
        - name: desk
          image: ghcr.io/pipe/desk:latest
          ports: [{ name: http, containerPort: 3000 }]
          envFrom:
            - secretRef: { name: pipe-segredos }
            - configMapRef: { name: pipe-config }
          resources:
            requests: { cpu: 100m, memory: 384Mi }
            limits: { cpu: '1', memory: 1Gi }
          readinessProbe:
            httpGet: { path: /api/saude, port: http }
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: desk
spec:
  selector: { app: desk }
  ports: [{ name: http, port: 80, targetPort: http }]
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: desk
spec:
  minAvailable: 1
  selector:
    matchLabels: { app: desk }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gestao
  labels: { app: gestao }
spec:
  replicas: 2
  selector:
    matchLabels: { app: gestao }
  template:
    metadata:
      labels: { app: gestao }
    spec:
      containers:
        - name: gestao
          image: ghcr.io/pipe/gestao:latest
          ports: [{ name: http, containerPort: 3000 }]
          envFrom:
            - secretRef: { name: pipe-segredos }
            - configMapRef: { name: pipe-config }
          resources:
            requests: { cpu: 100m, memory: 384Mi }
            limits: { cpu: '1', memory: 1Gi }
          readinessProbe:
            httpGet: { path: /api/saude, port: http }
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: gestao
spec:
  selector: { app: gestao }
  ports: [{ name: http, port: 80, targetPort: http }]
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: gestao
spec:
  minAvailable: 1
  selector:
    matchLabels: { app: gestao }
