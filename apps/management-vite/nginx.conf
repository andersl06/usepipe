server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    charset utf-8;
    server_tokens off;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 512;
    gzip_types text/plain text/css application/javascript image/svg+xml application/json;

    # SPA de verdade: toda rota que o React Router conhece (/portal, /fluxo/:id, …)
    # não tem arquivo próprio no disco. Sem o fallback para index.html, um F5 em
    # qualquer rota que não seja "/" vira 404 do nginx em vez de abrir a tela.
    location / {
        try_files $uri /index.html;
    }

    # O `vite build` grava hash no nome de CSS, JS e afins (`assets/x.a1b2c3.js`):
    # o próprio nome muda quando o conteúdo muda, então cache longo é seguro — não
    # existe "versão velha" para o navegador prender.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
