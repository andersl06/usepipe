server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    charset utf-8;
    server_tokens off;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 512;
    gzip_types text/plain text/css application/javascript image/svg+xml application/json;

    # /blog e /ferramentas resolvem para o index.html da pasta.
    location / {
        try_files $uri $uri/ $uri/index.html =404;
    }

    # A CSS, a JS e os SVG mudam junto com o deploy; cache curto e revalidação.
    location /assets/ {
        add_header Cache-Control "public, max-age=3600, must-revalidate";
    }

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location = /404.html { internal; }
    error_page 404 /index.html;
}
